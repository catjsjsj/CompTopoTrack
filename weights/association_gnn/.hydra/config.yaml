datamodule:
  dataset_params:
    num_frames: 10
    type_file: csv
    produce_gt: simple
    main_path: .
    dirs_path:
      train: [train]
      valid: [valid]
      test: [test]
    one_hot_label: true
    exp_name: sim_plus_release_2D
    overlap: 1
    jump_frames: 1
    mul_vals: [1.0, 1.0, 1.0]
    motion_scale:
      row: 78.0
      col: 85.0
    filter_edges: true
    directed: true
    edge_feat_embed_dict:
      p: 1
      use_normalized_x: true
      normalized_features: false
    separate_models: true
    normalize_all_cols: false
    same_frame: false
    next_frame: true
    self_loop: true
    normalize: false
    debug_visualization: false
    which_preprocess: MinMax
    drop_feat:
      - frame_num
      - area
      - min_row_bb
      - min_col_bb
      - max_row_bb
      - max_col_bb
      - centroid_row
      - centroid_col
      - major_axis_length
      - minor_axis_length
      - max_intensity
      - mean_intensity
      - min_intensity
