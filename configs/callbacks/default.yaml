model_checkpoint:
  _target_: pytorch_lightning.callbacks.ModelCheckpoint
  monitor: val/best_f1
  save_top_k: 1
  save_last: true
  mode: max
  verbose: false
  dirpath: checkpoints/
  filename: "{epoch:02d}"

early_stopping:
  _target_: pytorch_lightning.callbacks.EarlyStopping
  monitor: val/best_f1
  patience: 20
  mode: max
  min_delta: 0
