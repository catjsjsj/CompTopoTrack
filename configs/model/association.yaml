_target_: src.models.celltrack_plmodel.CellTrackLitModel
one_hot_label: ${one_hot}
loss_weights: 65
loss_mode: dynamic
metric_threshold_mode: validation_calibrated
sample: false
weight_loss: true
directed: true
separate_models: ${separate_models}

optim_module:
  target: Adam
  kwargs:
    lr: 0.001
    weight_decay: 0.00001

lr_sch_module:
  target: null
  monitor: val/acc
  kwargs:
    verbose: true
    mode: min

model_params:
  target: CellTrack_AssociationModel
  kwargs:
    input_mode: embedding_motion_trackastra
    motion_feature_dim: 4
    motion_input_indices: [1, 2, 3]
    motion_residual_scale: 1.0
    object_feature_dim: 7
    object_features_per_dim: 8
    object_feature_cutoff: 1000.0
    object_residual_scale: 1.0
    object_node_encoder_dic:
      fc_dims: [64, 32]
      dropout_p: 0.0
      use_batchnorm: false
    motion_encoder_dic:
      fc_dims: [16, 16]
      dropout_p: 0.0
      use_batchnorm: false
    motion_classifier_dic:
      fc_dims: [16, 1]
      dropout_p: 0.0
      use_batchnorm: false
    learned_NodeEncoder_dic:
      input_dim: 128
      fc_dims: [64, 32]
    edge_encoder_dic:
      fc_dims: [128, 64]
    message_passing:
      target: CellTrack_GNN
      kwargs:
        in_channels: 32
        hidden_channels: 32
        in_edge_channels: 64
        hidden_edge_channels_conv: 16
        hidden_edge_channels_linear: [128, 64]
        dropout: 0.0
        num_layers: 10
        num_nodes_features: 3
    edge_classifier_dic:
      input_dim: 64
      fc_dims: [128, 32, 1]
      dropout_p: 0.2
      use_batchnorm: false
